{% extends 'base.html' %}

{% block title %}Contact{% endblock %}

{% block content %}
<div class="hero">
<div class="section">
    <div class="section-header">
        <h2>Me contacter</h2>
        <div class="section-divider"></div>
        <p>Une question ou un projet ? N'hésitez pas à me contacter</p>
    </div>

    <div class="contact-section">
        <form method="post" class="contact-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_name">Nom</label>
                <input type="text" name="name" id="id_name" required 
                       class="form-control" placeholder="Votre nom">
            </div>
            
            <div class="form-group">
                <label for="id_email">Email</label>
                <input type="email" name="email" id="id_email" required 
                       class="form-control" placeholder="votre@email.com">
            </div>
            
            <div class="form-group">
                <label for="id_subject">Sujet</label>
                <input type="text" name="subject" id="id_subject" required 
                       class="form-control" placeholder="Sujet de votre message">
            </div>
            
            <div class="form-group">
                <label for="id_message">Message</label>
                <textarea name="message" id="id_message" rows="5" required 
                          class="form-control" placeholder="Votre message..."></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <i class="fas fa-paper-plane"></i> Envoyer
            </button>
        </form>
    </div>
</div>
</div>
{% endblock %}
